<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>二刀流・顔角度キャプチャ</title>
<style>
*{box-sizing:border-box}
:root{--bg:#080c14;--panel:#101827;--text:#fff;--muted:#b7c1d4;--line:#33415c}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
.app{width:min(100%,560px);margin:auto;padding:16px 14px 32px}
h1{font-size:23px;text-align:center;margin:4px 0 6px}
.lead{font-size:13px;line-height:1.6;text-align:center;color:var(--muted);margin-bottom:12px}
.camera{position:relative;overflow:hidden;border-radius:24px;background:#111827;aspect-ratio:3/4;border:1px solid rgba(255,255,255,.14)}
video{width:100%;height:100%;object-fit:cover}
#preview{transform:scaleX(-1)}
#playback{display:none;background:#000}
.shade{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 37% 31% at 50% 34%,transparent 0 73%,rgba(0,0,0,.26) 75%)}
.oval{position:absolute;width:52%;height:42%;left:24%;top:13%;border:3px solid rgba(255,255,255,.86);border-radius:50%;pointer-events:none}
.centerline{position:absolute;left:50%;top:18%;height:32%;border-left:1px dashed rgba(255,255,255,.42)}
.guide{position:absolute;left:16px;right:16px;bottom:16px;background:rgba(5,9,17,.82);backdrop-filter:blur(9px);padding:14px;border-radius:18px;text-align:center}
.stage{font-size:12px;color:#b7c1d4;margin-bottom:3px}
#arrow{font-size:43px;line-height:44px;height:44px;font-weight:900}
#instruction{font-size:23px;line-height:1.35;font-weight:900}
#detail{font-size:13px;line-height:1.4;color:#d5dbea;margin-top:4px}
#count{font-size:38px;font-weight:900;min-height:4px}
.progress{height:7px;margin-top:10px;background:#273247;border-radius:999px;overflow:hidden}
#bar{height:100%;width:0;background:#fff;border-radius:999px}
.buttons{display:grid;gap:10px;margin-top:13px}
button,.download{appearance:none;border:0;border-radius:15px;padding:14px 15px;font-weight:850;font-size:16px;text-align:center;text-decoration:none;cursor:pointer}
.primary{background:#fff;color:#08101d}
.secondary{background:#172238;color:#fff;border:1px solid #33415c}
button:disabled{opacity:.42}
.hidden{display:none!important}
.hint{font-size:12px;line-height:1.65;color:#aeb8ca;margin:12px 2px 0}
#results{display:none;margin-top:22px}
.section{background:var(--panel);border:1px solid #25334a;border-radius:20px;padding:14px;margin-top:12px}
.section h2{font-size:18px;margin:0 0 4px}
.section p{font-size:12px;color:var(--muted);margin:0 0 12px;line-height:1.55}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.candidate{background:#070b12;border:1px solid #27334a;border-radius:14px;padding:7px;min-width:0}
.candidate img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;display:block;background:#000}
.candidate .meta{text-align:center;font-size:11px;margin:7px 0 5px;color:#d8deea}
.candidate a{display:block;border-radius:9px;padding:8px 4px;text-align:center;background:#1b263b;color:#fff;text-decoration:none;font-size:11px;font-weight:800}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}
.status{display:inline-block;background:#1a263c;border:1px solid #30405d;border-radius:999px;font-size:11px;padding:4px 8px;margin-bottom:9px;color:#dbe4f4}
canvas{display:none}
@media(max-width:380px){#instruction{font-size:20px}.candidate a{font-size:10px}}
</style>
</head>
<body>
<div class="app">
  <h1>二刀流・顔角度キャプチャ</h1>
  <div class="lead">
    動画を後から解析せず、<b>撮影中に6コマを同時保存</b>します。<br>
    撮影終了後、すぐ候補が表示されます。
  </div>

  <div class="camera">
    <video id="preview" autoplay muted playsinline></video>
    <video id="playback" controls playsinline></video>

    <div id="overlay">
      <div class="shade"></div>
      <div class="oval"></div>
      <div class="centerline"></div>
      <div class="guide">
        <div id="stage" class="stage">準備</div>
        <div id="arrow">●</div>
        <div id="instruction">インカメラを起動</div>
        <div id="detail">スマホを目の高さにしてください</div>
        <div id="count"></div>
        <div class="progress"><div id="bar"></div></div>
      </div>
    </div>
  </div>

  <div class="buttons">
    <button id="startCamera" class="primary">① インカメラを起動</button>
    <button id="record" class="primary" disabled>② 撮影して6枚を作る</button>
    <button id="retake" class="secondary hidden">撮り直す</button>
  </div>

  <div class="hint">
    肩は正面のまま、首だけを急にひねらず、ゆっくり動かしてください。<br>
    左へ向く途中で3枚、右へ向く途中で3枚を自動撮影します。
  </div>

  <div id="results">
    <div class="status">6枚を撮影済み</div>

    <div class="section">
      <h2>打者向き候補</h2>
      <p>左へ向く途中の「浅め・中間・深め」の3角度です。</p>
      <div id="batterGrid" class="grid"></div>
    </div>

    <div class="section">
      <h2>投手向き候補</h2>
      <p>右へ向く途中の「浅め・中間・深め」の3角度です。</p>
      <div id="pitcherGrid" class="grid"></div>
    </div>

    <div class="section">
      <h2>保存</h2>
      <p>各候補をPNG保存できます。元動画は対応ブラウザのみ保存できます。</p>
      <div class="row">
        <button id="swap" class="secondary">打者／投手を入れ替える</button>
        <a id="videoDownload" class="download secondary hidden">元動画を保存</a>
      </div>
      <div class="row">
        <button id="again" class="secondary">もう一度撮る</button>
        <button id="cameraAgain" class="secondary">カメラへ戻る</button>
      </div>
    </div>
  </div>

  <canvas id="workCanvas"></canvas>
</div>

<script>
const preview = document.getElementById('preview');
const playback = document.getElementById('playback');
const overlay = document.getElementById('overlay');
const startCameraBtn = document.getElementById('startCamera');
const recordBtn = document.getElementById('record');
const retakeBtn = document.getElementById('retake');
const againBtn = document.getElementById('again');
const cameraAgainBtn = document.getElementById('cameraAgain');
const swapBtn = document.getElementById('swap');

const stage = document.getElementById('stage');
const instruction = document.getElementById('instruction');
const detail = document.getElementById('detail');
const arrow = document.getElementById('arrow');
const count = document.getElementById('count');
const bar = document.getElementById('bar');

const results = document.getElementById('results');
const batterGrid = document.getElementById('batterGrid');
const pitcherGrid = document.getElementById('pitcherGrid');
const videoDownload = document.getElementById('videoDownload');
const workCanvas = document.getElementById('workCanvas');

let stream = null;
let recorder = null;
let chunks = [];
let recordingUrl = null;
let frames = {batter:[], pitcher:[]};
let swapped = false;

const labels = ['浅め','中間','深め'];
const sleep = ms => new Promise(r => setTimeout(r, ms));

function supportedMime(){
  const types=[
    'video/mp4;codecs=h264',
    'video/mp4',
    'video/webm;codecs=vp9',
    'video/webm;codecs=vp8',
    'video/webm'
  ];
  if(!window.MediaRecorder) return '';
  for(const t of types){
    if(MediaRecorder.isTypeSupported(t)) return t;
  }
  return '';
}

async function startCamera(){
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:'user',
        width:{ideal:1280},
        height:{ideal:1600}
      },
      audio:false
    });
    preview.srcObject = stream;
    await preview.play();

    startCameraBtn.classList.add('hidden');
    recordBtn.disabled = false;
    stage.textContent='準備OK';
    instruction.textContent='顔を白い枠の中央へ';
    detail.textContent='あごを少し引き、カメラを見ます';
  }catch(e){
    alert('カメラを起動できませんでした。ブラウザのカメラ許可を確認してください。');
  }
}

function captureFrame(group,index){
  const vw = preview.videoWidth;
  const vh = preview.videoHeight;
  if(!vw || !vh) return;

  // 顔ガイド位置に合わせた正方形クロップ。
  const side = Math.round(Math.min(vw*0.64, vh*0.50));
  let sx = Math.round(vw/2 - side/2);
  let sy = Math.round(vh*0.095);
  sx = Math.max(0, Math.min(sx, vw-side));
  sy = Math.max(0, Math.min(sy, vh-side));

  // 出力は900x900。スマホでも処理が重くなりにくい。
  const out = 900;
  workCanvas.width = out;
  workCanvas.height = out;
  const ctx = workCanvas.getContext('2d', {alpha:false});
  ctx.drawImage(preview, sx, sy, side, side, 0, 0, out, out);

  const url = workCanvas.toDataURL('image/png');
  frames[group].push({label:labels[index], dataUrl:url});
}

async function countdown(){
  stage.textContent='撮影開始';
  instruction.textContent='そのまま';
  detail.textContent='3秒後に始まります';
  arrow.textContent='●';
  for(let n=3;n>=1;n--){
    count.textContent=n;
    await sleep(650);
  }
  count.textContent='';
}

async function phase(ms,stageText,title,sub,arr,onProgress){
  stage.textContent=stageText;
  instruction.textContent=title;
  detail.textContent=sub;
  arrow.textContent=arr;
  bar.style.width='0%';

  const start=performance.now();
  let lastP=0;
  while(performance.now()-start < ms){
    const p=Math.min(1,(performance.now()-start)/ms);
    bar.style.width=(p*100)+'%';
    if(onProgress) onProgress(p,lastP);
    lastP=p;
    await sleep(35);
  }
  bar.style.width='100%';
  if(onProgress) onProgress(1,lastP);
}

function makeSnapper(group){
  const marks=[0.34,0.55,0.76];
  const done=[false,false,false];
  return (p,lastP)=>{
    marks.forEach((m,i)=>{
      if(!done[i] && p>=m){
        done[i]=true;
        captureFrame(group,i);
      }
    });
  };
}

function startRecorderIfPossible(){
  chunks=[];
  if(!window.MediaRecorder || !stream) return;

  const mime=supportedMime();
  try{
    recorder = mime
      ? new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:6000000})
      : new MediaRecorder(stream,{videoBitsPerSecond:6000000});
  }catch(e){
    recorder=null;
    return;
  }

  recorder.ondataavailable=e=>{
    if(e.data && e.data.size) chunks.push(e.data);
  };
  recorder.onstop=()=>{
    if(!chunks.length) return;
    const type=recorder.mimeType || 'video/webm';
    const blob=new Blob(chunks,{type});
    if(recordingUrl) URL.revokeObjectURL(recordingUrl);
    recordingUrl=URL.createObjectURL(blob);

    playback.src=recordingUrl;
    const ext=type.includes('mp4')?'mp4':'webm';
    videoDownload.href=recordingUrl;
    videoDownload.download='二刀流_顔角度_元動画.'+ext;
    videoDownload.classList.remove('hidden');
  };

  try{recorder.start(250)}catch(e){recorder=null}
}

async function recordSequence(){
  if(!stream) return;

  recordBtn.disabled=true;
  results.style.display='none';
  retakeBtn.classList.add('hidden');
  frames={batter:[],pitcher:[]};
  swapped=false;
  videoDownload.classList.add('hidden');

  await countdown();
  startRecorderIfPossible();

  await phase(1800,'正面','正面を向いてください','目線はカメラ。肩は正面のまま','●');

  const batterSnap=makeSnapper('batter');
  await phase(3000,'打者用','あなたの左へ ゆっくり','止まらず、ゆっくり約20°まで','←',batterSnap);

  await phase(1200,'中央へ','正面へ戻してください','ゆっくり中央へ','●');

  const pitcherSnap=makeSnapper('pitcher');
  await phase(3000,'投手用','あなたの右へ ゆっくり','止まらず、ゆっくり約20°まで','→',pitcherSnap);

  await phase(1000,'終了','正面へ戻してください','撮影完了です','●');

  if(recorder && recorder.state!=='inactive'){
    try{recorder.stop()}catch(e){}
  }

  showResultsImmediately();
}

function card(item,groupName,num){
  const div=document.createElement('div');
  div.className='candidate';

  const img=document.createElement('img');
  img.src=item.dataUrl;
  img.alt=`${groupName}候補${num}`;

  const meta=document.createElement('div');
  meta.className='meta';
  meta.textContent=`${num}. ${item.label}`;

  const a=document.createElement('a');
  a.href=item.dataUrl;
  a.download=`${groupName}_候補${num}_${item.label}.png`;
  a.textContent='PNG保存';

  div.append(img,meta,a);
  return div;
}

function renderCandidates(){
  batterGrid.innerHTML='';
  pitcherGrid.innerHTML='';

  const b=swapped?frames.pitcher:frames.batter;
  const p=swapped?frames.batter:frames.pitcher;

  b.forEach((item,i)=>batterGrid.appendChild(card(item,'打者向き',i+1)));
  p.forEach((item,i)=>pitcherGrid.appendChild(card(item,'投手向き',i+1)));
}

function showResultsImmediately(){
  renderCandidates();

  stage.textContent='完了';
  instruction.textContent='6枚できました';
  detail.textContent='下に候補を表示します';
  arrow.textContent='✓';
  bar.style.width='100%';

  results.style.display='block';
  retakeBtn.classList.remove('hidden');
  recordBtn.classList.add('hidden');

  results.scrollIntoView({behavior:'smooth',block:'start'});
}

function resetForRetake(){
  results.style.display='none';
  retakeBtn.classList.add('hidden');
  recordBtn.classList.remove('hidden');
  recordBtn.disabled=false;

  stage.textContent='準備OK';
  instruction.textContent='顔を白い枠の中央へ';
  detail.textContent='あごを少し引き、カメラを見ます';
  arrow.textContent='●';
  bar.style.width='0%';
}

function swapGroups(){
  swapped=!swapped;
  renderCandidates();
}

function backToCamera(){
  results.style.display='none';
  window.scrollTo({top:0,behavior:'smooth'});
}

startCameraBtn.addEventListener('click',startCamera);
recordBtn.addEventListener('click',recordSequence);
retakeBtn.addEventListener('click',resetForRetake);
againBtn.addEventListener('click',resetForRetake);
swapBtn.addEventListener('click',swapGroups);
cameraAgainBtn.addEventListener('click',backToCamera);
</script>
</body>
</html>
